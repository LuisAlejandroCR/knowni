# prover/Cargo.toml: the native Groth16 prover for eligibility.circom over
# BLS12-381. The same crate is what the iOS and Android bindings will wrap.

[package]
name = "knowni-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anyhow = "1"
# Pinned to the versions circom-prover's zkey reader is built against.
ark-bls12-381 = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-poly = "=0.5.0"
ark-relations = "=0.5.0"
ark-std = "=0.5.0"
circom-prover = { version = "=0.1.4", default-features = false, features = ["arkworks"] }
num-bigint = "0.4"
rust-witness = "=0.1.6"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
rust-witness = "=0.1.6"
