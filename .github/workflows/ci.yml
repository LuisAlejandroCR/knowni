# ci.yml: CI de Knowni — instala desde cero y corre la suite en Node 22 y 24.
# Es la evidencia del criterio A14 del plan: la suite parte de un clon limpio.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run lint
      # The suite runs TypeScript by stripping its types, so nothing else here
      # ever asks the compiler whether they are right — criterio A14.
      - run: npm run typecheck
      - run: npm test

  # The signal order the contract asserts against is written by the Circom
  # compiler, so CI regenerates it and refuses a fixture that has drifted.
  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install --locked --git https://github.com/iden3/circom.git --tag v2.2.3 circom
      - run: git clone --depth 1 https://github.com/iden3/circomlib.git /tmp/circomlib
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      # The root install is what links @knowni/* into node_modules, and the
      # generator reads the domain list from core through it.
      - run: npm install
      - name: check the domain constants were generated, not typed
        run: node --experimental-strip-types circuits/tools/write-domains.ts | diff - circuits/domains.circom
      - name: check the poseidon constants were generated, not typed
        run: |
          node --experimental-strip-types circuits/tools/write-poseidon.ts \
            | diff - circuits/poseidon_knowni.circom
          node --experimental-strip-types circuits/tools/write-poseidon.ts bls12381 \
            | diff - circuits/poseidon_knowni_bls12381.circom
      - name: compile the circuit and check the public signal order
        working-directory: circuits
        run: |
          circom eligibility.circom -l /tmp/circomlib/circuits -l . --r1cs --sym --output /tmp
          head -13 /tmp/eligibility.sym | cut -d, -f4 | sed 's/^main\.//' > /tmp/signals.txt
          grep -v '^#' eligibility.signals.txt | diff - /tmp/signals.txt
      # Compiling proves nothing about the permutation: constants for another
      # field are still *some* constants. Building a witness and comparing it
      # with core is what makes the two implementations one.
      - name: check the circuit and core agree on the digest
        working-directory: circuits
        run: |
          circom test/poseidon_main.circom -l . --wasm --output /tmp
          echo '{"inputs":["1","2"]}' > /tmp/poseidon_input.json
          npx --yes snarkjs@0.7.5 wtns calculate \
            /tmp/poseidon_main_js/poseidon_main.wasm /tmp/poseidon_input.json /tmp/poseidon.wtns
          npx --yes snarkjs@0.7.5 wtns export json /tmp/poseidon.wtns /tmp/poseidon_witness.json
          node --experimental-strip-types tools/check-poseidon-witness.ts /tmp/poseidon_witness.json
      # A claim commitment is where the two implementations actually meet, so
      # the witness is rebuilt here rather than trusted to a number somebody
      # copied out of a terminal once.
      - name: check the circuit and core agree on the income commitment
        working-directory: circuits
        run: |
          circom test/income_main.circom -l . -l /tmp/circomlib/circuits --wasm --output /tmp
          node --experimental-strip-types tools/write-claim-input.ts > /tmp/income_input.json
          npx --yes snarkjs@0.7.5 wtns calculate \
            /tmp/income_main_js/income_main.wasm /tmp/income_input.json /tmp/income.wtns
          npx --yes snarkjs@0.7.5 wtns export json /tmp/income.wtns /tmp/income_witness.json
          node --experimental-strip-types tools/check-claim-witness.ts /tmp/income_witness.json
      # The curve Stellar verifies. The BLS constants file is a drop-in for the
      # BN254 one — same template names — so the swap is a directory on -l.
      - name: compile the circuit on BLS12-381 too
        working-directory: circuits
        run: |
          mkdir -p /tmp/bls && cp poseidon_knowni_bls12381.circom /tmp/bls/poseidon_knowni.circom
          circom eligibility.circom -l /tmp/bls -l . -l /tmp/circomlib/circuits \
            -p bls12381 --r1cs --sym --output /tmp/bls
          head -13 /tmp/bls/eligibility.sym | cut -d, -f4 | sed 's/^main\.//' > /tmp/bls/signals.txt
          grep -v '^#' eligibility.signals.txt | diff - /tmp/bls/signals.txt
      - name: check the circuit and core agree on the digest over BLS12-381
        working-directory: circuits
        run: |
          circom test/poseidon_main.circom -l /tmp/bls -l . -p bls12381 --wasm --output /tmp/bls
          echo '{"inputs":["1","2"]}' > /tmp/bls/poseidon_input.json
          npx --yes snarkjs@0.7.5 wtns calculate \
            /tmp/bls/poseidon_main_js/poseidon_main.wasm /tmp/bls/poseidon_input.json \
            /tmp/bls/poseidon.wtns
          npx --yes snarkjs@0.7.5 wtns export json /tmp/bls/poseidon.wtns /tmp/bls/witness.json
          node --experimental-strip-types tools/check-poseidon-witness.ts /tmp/bls/witness.json bls12381

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `Cargo.lock` está versionado a propósito: `soroban-env-host` pide
      # `ed25519-dalek >= 2.0.0`, sin techo, y la 3.0.0 no compila con él.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --locked
        working-directory: contracts/knowni-verifier
      - run: cargo build --locked --release --target wasm32-unknown-unknown
        working-directory: contracts/knowni-verifier

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      # The root install links @knowni/* into node_modules, which is how the
      # app resolves the domain under plain `node --test`.
      - run: npm install
      - run: npm install
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      # Typecheck and tests both run under Node, where `Buffer` and the node
      # builtins exist. Only the bundler answers whether the app Metro packages
      # actually resolves on a phone — criterio P8 y A14.
      - name: bundle the app for iOS and Android
        working-directory: app
        run: npm run bundle
      - name: check both bundles were produced
        working-directory: app
        run: |
          test -n "$(find dist/_expo/static/js/ios -name '*.hbc' -print -quit)"
          test -n "$(find dist/_expo/static/js/android -name '*.hbc' -print -quit)"
