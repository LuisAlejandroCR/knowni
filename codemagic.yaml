# codemagic.yaml: builds the iOS app on a Codemagic Mac, ad hoc for the
# iPhones registered on the Apple team. Exists because EAS's free iOS builds ran
# out; the prover xcframework is not built here yet, so /prueba says unsupported.

workflows:
  ios-adhoc:
    name: iOS ad hoc
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # The App Store Connect API key, added in Codemagic → Team → Integrations
      # under exactly this name. Codemagic signs with it; no secret lives here.
      app_store_connect: knowni-asc
    environment:
      groups:
        # CERTIFICATE_PRIVATE_KEY: the RSA key the distribution certificate is
        # made from. Lives only in Codemagic → Environment variables.
        - knowni-signing
      vars:
        # Public by design: an app id, not a secret. Baked into the JS bundle.
        EXPO_PUBLIC_CAVOS_APP_ID: cav_78814c12924b033b7691b817cd66971626d0
      node: 22.18.0
      xcode: latest
      cocoapods: default
    # No `triggering` block: builds start only from the Codemagic UI, never on a
    # push, so a Mac minute is spent only when someone asks for one.
    scripts:
      - name: Install app dependencies
        working_directory: app
        script: npm ci
      - name: Generate the native iOS project
        working_directory: app
        script: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working_directory: app/ios
        script: pod install
      - name: Fetch or create the ad hoc certificate and profile
        # Uses the knowni-asc key: creates what Apple lacks, including a profile
        # that lists every registered iPhone, then points the project at it.
        # A capability added on the App ID makes old profiles stale; they go.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files co.knowni.wallet             --type IOS_APP_ADHOC             --delete-stale-profiles             --create
          keychain add-certificates
          xcode-project use-profiles --project app/ios/Knowni.xcodeproj
      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --workspace app/ios/Knowni.xcworkspace \
            --scheme Knowni
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
